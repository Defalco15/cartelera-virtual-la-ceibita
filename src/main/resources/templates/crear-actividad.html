<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear actividad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>Publicar actividad comunitaria</h1>
        <p>Cartelera Virtual La Ceibita</p>
    </header>

    <main class="contenedor">

        <section class="tarjeta">

            <h2>Nueva actividad</h2>

            <form th:action="@{/admin/actividades/guardar}" method="post">

                <label>Título de la actividad:</label>
                <input type="text" name="titulo" required>

                <br><br>

                <label>Descripción:</label>
                <textarea name="descripcion" rows="5" required></textarea>

                <br><br>

                <label>Lugar:</label>
                <input type="text" name="lugar" required>

                <br><br>

                <label>Fecha y hora de inicio:</label>
<input type="datetime-local" name="fechaActividad" required>

<br><br>

<label>Fecha y hora de finalización:</label>
<input type="datetime-local" name="fechaFin" required>

                <br><br>

                <button type="submit" class="boton">Publicar actividad</button>

            </form>

            <br>

            <a href="/admin/actividades">Volver a actividades</a>

            <br><br>

            <a href="/admin/panel">Volver al panel</a>

        </section>

    </main>

</body>
</html>
