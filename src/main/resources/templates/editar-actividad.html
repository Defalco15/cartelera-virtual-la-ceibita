
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar actividad - La Ceibita</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<header>
    <h1>Cartelera Virtual La Ceibita</h1>
    <p>Modificar actividad comunitaria</p>
</header>

<main class="contenedor">

    <section class="bienvenida">

        <h2>Editar actividad</h2>

        <form th:action="@{/admin/actividades/actualizar}" method="post">

            <input type="hidden" name="id" th:value="${actividad.id}">

            <label>Título:</label>
            <input type="text" name="titulo"
                   th:value="${actividad.titulo}" required>

            <br><br>

            <label>Descripción:</label>
            <textarea name="descripcion" rows="4"
                      required th:text="${actividad.descripcion}"></textarea>

            <br><br>

            <label>Lugar:</label>
            <input type="text" name="lugar"
                   th:value="${actividad.lugar}" required>

            <br><br>

            <label>Fecha y hora de inicio:</label>
            <input type="datetime-local" name="fechaActividad"
                   th:value="${#temporals.format(actividad.fechaActividad, 'yyyy-MM-dd''T''HH:mm')}"
                   required>

            <br><br>

            <label>Fecha y hora de finalización:</label>
            <input type="datetime-local" name="fechaFin"
                   th:value="${#temporals.format(actividad.fechaFin, 'yyyy-MM-dd''T''HH:mm')}"
                   required>

            <br><br>

            <button type="submit">Guardar cambios</button>

        </form>

        <br>

        <a href="/admin/actividades">Volver a las actividades</a>

    </section>

</main>

</body>
</html>
