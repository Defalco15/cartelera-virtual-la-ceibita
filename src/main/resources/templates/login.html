
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrativo - La Ceibita</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <style>
        .login-contenedor {
            max-width: 420px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000018;
        }

        .login-contenedor h2 {
            color: #176b55;
            text-align: center;
            margin-bottom: 25px;
        }

        .login-contenedor input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-contenedor button {
            width: 100%;
            padding: 13px;
            background: #176b55;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-contenedor button:hover {
            background: #105442;
        }

        .error {
            color: #c62828;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cartelera Virtual La Ceibita</h1>
        <p>Panel de administración</p>
    </header>

    <main class="login-contenedor">

        <h2>Acceso administrativo</h2>

        <p>Ingresa tus datos para continuar.</p>

        <p class="error" th:if="${error}">
            Usuario o contraseña incorrectos.
        </p>

        <form th:action="@{/admin/login}" method="post">

            <label>Usuario</label>
            <input type="text" name="usuario" placeholder="Ingresa tu usuario" required>

            <label>Contraseña</label>
            <input type="password" name="contrasena" placeholder="Ingresa tu contraseña" required>

            <button type="submit">Iniciar sesión</button>

        </form>

    </main>

</body>
</html>
