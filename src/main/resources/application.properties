spring.application.name=cartelera-ceibita

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cartelera_ceibita?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Caracas}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}